<main class="flex flex-col grow">
  <section class="container mx-auto pxc-4 pyc-4 flex flex-col gapc-3">
    <div>
      <h3>Showcase</h3>
      <p class="text-on-surface-variant text-sm">
        One page per component, for building and designing them in isolation.
        Each page names the file it is rendered from.
      </p>
    </div>

    <ul class="menu">
      {{ range .Items }}
      <li class="menu-item">{{ . }}</li>
      {{ end }}
    </ul>
  </section>
</main>
