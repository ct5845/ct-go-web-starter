<main class="flex flex-col grow">
  <section class="container mx-auto pxc-4 pyc-4 flex flex-col gapc-2">
    <h1>Showcase</h1>
    <p class="text-on-surface-variant text-sm">
      One page per component, for building and designing them in isolation. Each
      page names the file it is rendered from.
    </p>

    {{ range .Sections }}
    <div class="flex flex-col gap-2">
      {{ if .Label }}<h4>{{ .Label }}</h4>{{ end }}
      <ul class="menu">
        {{ range .Items }}
        <li class="menu-item">{{ . }}</li>
        {{ end }}
      </ul>
    </div>
    {{ end }}
  </section>
</main>
