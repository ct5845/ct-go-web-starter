<main class="flex flex-col grow">
  <section class="container mx-auto pxc-4 ptc-2 flex flex-col gapc-2">
    <div class="flex items-baseline gapc-2 flex-wrap">
      <a
        class="btn btn-icon self-center"
        aria-label="Back to showcase"
        href="/showcase"
      >
        <span aria-hidden="true" class="icon">close</span>
      </a>
      <h1>{{ .Title }}</h1>
      <code class="text-xs">src/{{ .Source }}</code>
    </div>
    <nav aria-label="Showcase">{{ .Nav }}</nav>
    <p class="text-on-surface-variant text-sm">{{ .Description }}</p>
  </section>

  {{ .Content }}
</main>
