<label
  for="{{ .Id }}"
  class="checkboxgroup-option btn rounded-none! whitespace-nowrap text-on-surface-variant"
>
  <input
    type="checkbox"
    id="{{ .Id }}"
    name="{{ .Name }}"
    value="{{ .Value }}"
    {{ if .Checked }}checked{{ end }}
    class="field-control sr-only"
  />
  <span aria-hidden="true" class="icon icon-fill-1 checkboxgroup-check">check_box</span>
  <span aria-hidden="true" class="icon checkboxgroup-unchecked">check_box_outline_blank</span>
  {{ .Label }}
</label>
