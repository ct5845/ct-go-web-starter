<section class="container mx-auto pxc-4 pyc-3">
  <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
    {{ range .Swatches }}
    <div
      class="{{ .Background }} {{ .Foreground }} rounded-xl border border-outline-variant p-4 flex flex-col gap-1"
    >
      <span class="font-bold text-sm">{{ .Label }}</span>
      <code class="text-xs {{ .Background }} {{ .Foreground }} px-0"
        >{{ .Background }} {{ .Foreground }}</code
      >
    </div>
    {{ end }}
  </div>
</section>
