<fieldset
  class="field flex flex-col gap-1 border-none p-0 m-0"
  {{ .DescribedBy }}
  {{ .Invalid }}
  x-data="inputControl('{{ .GroupId }}')"
  x-on:change="change($event)"
>
  <legend class="text-sm font-medium p-0"
    >{{ .Label }}{{ if .Required }}<span aria-hidden="true"> *</span>{{ end
    }}</legend
  >
  <div
    class="flex flex-col overflow-y-auto bg-container-lowest rounded-2xl border border-outline-variant"
  >
    {{ range .Options }}{{ . }}{{ end }}
  </div>
  {{ if .Hint }}
  <p {{ .HintId }} class="field-hint text-xs text-on-surface-variant">{{ .Hint }}</p>
  {{ end }} {{ if .Error }}
  <p {{ .ErrorId }} class="text-xs text-error" role="alert">{{ .Error }}</p>
  {{ end }}
</fieldset>
