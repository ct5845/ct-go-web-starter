<div class="p-4 flex flex-col gap-4">
  <h3>Delete this item?</h3>
  <p class="text-on-surface-variant">This action can't be undone.</p>
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="btn btn-outline"
      command="close"
      commandfor="{{ .Id }}"
    >
      Cancel
    </button>
    <button type="button" class="btn btn-primary" command="close" commandfor="{{ .Id }}">
      Delete
    </button>
  </div>
</div>
